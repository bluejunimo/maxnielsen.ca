<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Basic styling for the tooltip */
        dfn {
            position: relative;
            cursor: help;
        }

        dfn::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px;
            background-color: #333;
            color: #fff;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        dfn:hover::after {
            opacity: 1;
        }

        body {
            margin-left: 10rem;
            margin-top: 10rem;
        }
    </style>
    <title>Tooltip Example</title>
</head>
<body>
    <p><dfn title="The brother of Alice">Bob</dfn> is posting a message on Reddit.</p>
</body>
</html>
